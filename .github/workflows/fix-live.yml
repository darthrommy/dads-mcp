name: Fix live site check

# Live site check が失敗したら、Claude Code に原因を調べさせ、直せたら修正のプルリクエストを作らせる。
#
# 動かすための準備（1 回だけ）:
#   Claude Code でこのリポジトリを開き、/install-github-app を実行する。
#   Claude GitHub App が入り、Secret（CLAUDE_CODE_OAUTH_TOKEN か ANTHROPIC_API_KEY）が登録される。
# Secret がない間は、このワークフローは何もせずに終わる。
on:
  workflow_run:
    workflows: ["Live site check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: fix-live
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check secret and open fix PRs
        id: gate
        env:
          HAS_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN も ANTHROPIC_API_KEY も登録されていないので、何もせずに終わります"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("claude/fix-live-"))] | length')
          if [ "$open" != "0" ]; then
            echo "::notice::修正のプルリクエストがすでに開いているので、新しくは作りません"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 26
          cache: npm

      - name: Prepare
        id: prep
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          npm ci
          git config --global user.name "claude[bot]"
          git config --global user.email "claude[bot]@users.noreply.github.com"
          branch="claude/fix-live-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          {
            echo "log<<DADS_LOG_EOF"
            gh run view "$FAILED_RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed | tail -n 150
            echo "DADS_LOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fix with Claude Code
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebFetch,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(curl:*)"
          prompt: |
            週 1 回の実サイト確認（Live site check、`npm run test:live`）が失敗しました。
            原因を調べて、直せるなら修正のプルリクエストを作ってください。

            リポジトリ: ${{ github.repository }}
            失敗した実行: ${{ github.event.workflow_run.html_url }}
            作業ブランチ: ${{ steps.prep.outputs.branch }}（チェックアウト済み。ベースは main）

            失敗したジョブのログの末尾:
            ```
            ${{ steps.prep.outputs.log }}
            ```

            進め方:
            1. 最初に CLAUDE.md を読み、そこに書かれたルールに従ってください。特に、ガイドライン本文をリポジトリ、フィクスチャ、コミットメッセージ、プルリクエストの本文に入れないこと。
            2. `npm run test:live` をもう一度実行してください。今回は通る場合（一時的なネットワーク障害やサイトの停止）は、何も変更せず、プルリクエストも作らずに終えてください。
            3. 実サイトの HTML などを調べるときは `$RUNNER_TEMP` の下に保存し、終わったら消してください。
            4. サイトの構造の変化を、架空の文章を使ったフィクスチャで再現して失敗するテストを書き、それから直してください。
            5. `npm run typecheck`、`npm test`、`npm run test:live` がすべて通ることを確かめてください。
            6. 作業ブランチにコミットして push し、`gh pr create --base main` でプルリクエストを作ってください。本文には、何が変わって落ちたのか、何を直したのか、3 つのコマンドの結果を書いてください。
            7. 直し方が決められない場合や、サイト側の不具合と考えられる場合は、プルリクエストを作らず、調べた結果を最後の応答に書いて終えてください。
